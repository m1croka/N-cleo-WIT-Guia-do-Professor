<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guia do Professor | Flipbook</title>
  <style>
    :root{--bg:#17131f;--panel:#241b33;--text:#f7f4fb;--muted:#c9bfd8;--accent:#83bf24}
    *{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#34204f 0,#17131f 58%);color:var(--text);overflow:hidden}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
    header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(20,14,29,.82);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
    .brand{font-weight:700;white-space:nowrap}.brand span{color:var(--accent)}
    .spacer{flex:1}.btn{border:1px solid rgba(255,255,255,.16);background:#2e2340;color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}.btn:hover{background:#3a2b50}.btn:disabled{opacity:.45;cursor:not-allowed}
    input[type=file]{display:none}
    #stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 70px}
    #bookViewport{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%;position:relative} #book{box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .page{background:white;overflow:hidden;position:relative}.page canvas{width:100%;height:100%;display:block;background:white}.pdfLink{position:absolute;z-index:2147483647;display:block;cursor:pointer;background:rgba(0,0,0,0);border-radius:3px;pointer-events:auto}.pdfLink:hover{background:rgba(131,191,36,.18);outline:2px solid rgba(131,191,36,.7)}#linkOverlay{position:absolute;inset:0;z-index:2147483646;pointer-events:none}
    .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:white;font-size:28px;cursor:pointer;backdrop-filter:blur(8px)}
    .nav:hover{background:rgba(255,255,255,.22)} #prev{left:12px} #next{right:12px}
    footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 14px;background:rgba(20,14,29,.82);border-top:1px solid rgba(255,255,255,.08);font-size:14px;color:var(--muted)}
    #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);pointer-events:none}
    .hidden{display:none!important}
    #reader{position:fixed;inset:0;z-index:50;background:rgba(10,8,14,.96);display:grid;grid-template-rows:auto 1fr}
    #readerBar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:#17131f;border-bottom:1px solid rgba(255,255,255,.12)}
    #readerViewport{overflow:auto;text-align:center;padding:18px}
    #readerPage{position:relative;display:inline-block;line-height:0}#readerCanvas{background:#fff;box-shadow:0 12px 45px rgba(0,0,0,.5);max-width:none;display:block}
    .hint{font-size:12px;color:var(--muted);margin-left:6px}
    #book{cursor:zoom-in}
    @media(max-width:700px){header{padding:8px}.brand{font-size:13px}#stage{padding:10px 44px}.nav{width:36px;height:54px;font-size:22px}#prev{left:4px}#next{right:4px}.btn{padding:8px 9px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Núcleo <span>WIT</span> • Guia do Professor</div>
    <div class="spacer"></div>
    <label class="btn" for="pdfInput">Abrir outro PDF</label>
    <input id="pdfInput" type="file" accept="application/pdf" />
    <button class="btn" id="readCurrent">Ampliar página</button><button class="btn" id="fullscreen" title="Tela cheia">Tela cheia</button>
  </header>
  <main id="stage">
    <button class="nav" id="prev" aria-label="Página anterior">‹</button>
    <div id="bookViewport"><div id="book"></div><div id="linkOverlay"></div></div>
    <button class="nav" id="next" aria-label="Próxima página">›</button>
    <div id="status">Carregando o Guia do Professor…</div>
  </main>
  <footer><span id="counter">Página 1</span><span>•</span><span>Uma página por vez • arraste o canto ou use as setas</span></footer>
</div>
<div id="reader" class="hidden"><div id="readerBar"><button class="btn" id="readerPrev">‹</button><button class="btn" id="zoomOut">−</button><span id="zoomLabel">150%</span><button class="btn" id="zoomIn">+</button><button class="btn" id="readerNext">›</button><span class="hint">Use o zoom para facilitar a leitura</span><button class="btn" id="closeReader">Fechar</button></div><div id="readerViewport"><div id="readerPage"><canvas id="readerCanvas"></canvas></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
  const DEFAULT_PDF='Guia-do-Professor.pdf';
  const bookEl=document.getElementById('book'), statusEl=document.getElementById('status'), counter=document.getElementById('counter');
  let flip=null, objectUrl=null, currentPdf=null, readerPage=1, readerZoom=1.5, pageLinks=[];

  async function loadPdf(src){
    statusEl.classList.remove('hidden'); statusEl.textContent='Carregando o PDF…'; bookEl.innerHTML='';
    if(flip){try{flip.destroy()}catch(e){} flip=null;}
    try{
      const pdf=await pdfjsLib.getDocument(src).promise; currentPdf=pdf;
      const first=await pdf.getPage(1), vp=first.getViewport({scale:1});
      const ratio=vp.width/vp.height;
      const stage=document.getElementById('stage');
      const maxH=Math.max(320,stage.clientHeight-18), maxW=Math.max(240,stage.clientWidth-120);
      let h=Math.min(maxH,1100), w=h*ratio;
      if(w>maxW){w=maxW;h=w/ratio}
      const viewportEl=document.getElementById('bookViewport');
      viewportEl.style.width=Math.round(w)+'px';
      viewportEl.style.height=Math.round(h)+'px';
      const pages=[];
      for(let n=1;n<=pdf.numPages;n++){
        statusEl.textContent=`Preparando página ${n} de ${pdf.numPages}…`;
        const page=await pdf.getPage(n);
        const renderScale=Math.max(1.35,(w*1.7)/vp.width);
        const viewport=page.getViewport({scale:renderScale});
        const div=document.createElement('div'); div.className='page';
        const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d',{alpha:false});
        canvas.width=Math.floor(viewport.width); canvas.height=Math.floor(viewport.height); div.appendChild(canvas); bookEl.appendChild(div); pages.push(div);
        await page.render({canvasContext:ctx,viewport}).promise;
        pageLinks[n-1]=await collectPdfLinks(page, viewport);
      }
      flip=new St.PageFlip(bookEl,{width:Math.round(w),height:Math.round(h),size:'fixed',minWidth:220,maxWidth:1200,minHeight:300,maxHeight:1600,showCover:false,mobileScrollSupport:false,usePortrait:true,maxShadowOpacity:.5,flippingTime:850,drawShadow:true,autoSize:true});
      flip.loadFromHTML(pages);
      const update=()=>{const idx=flip.getCurrentPageIndex();counter.textContent=`Página ${idx+1} de ${pdf.numPages}`;renderLinkOverlay(idx)};
      flip.on('flip',update); update(); statusEl.classList.add('hidden');
    }catch(err){
      console.error(err); statusEl.classList.remove('hidden');
      statusEl.innerHTML='Não foi possível abrir o PDF automaticamente.<br>Se você abriu este arquivo diretamente no computador, clique em <b>Abrir outro PDF</b> e selecione o Guia do Professor.';
    }
  }


  async function collectPdfLinks(page, viewport){
    const out=[];
    const annotations=await page.getAnnotations({intent:'display'});
    for(const a of annotations){
      if(a.subtype!=='Link' || !a.rect) continue;
      const url=annotationUrl(a); if(!url) continue;
      const r=viewport.convertToViewportRectangle(a.rect);
      out.push({url,left:Math.min(r[0],r[2])/viewport.width*100,top:Math.min(r[1],r[3])/viewport.height*100,width:Math.abs(r[2]-r[0])/viewport.width*100,height:Math.abs(r[3]-r[1])/viewport.height*100});
    }
    return out;
  }
  function makeLink(l){
    const a=document.createElement('a');a.className='pdfLink';a.href=l.url;a.target='_blank';a.rel='noopener';a.title='Abrir link';a.setAttribute('aria-label','Abrir link do PDF');
    a.style.left=l.left+'%';a.style.top=l.top+'%';a.style.width=l.width+'%';a.style.height=l.height+'%';
    ['pointerdown','mousedown','touchstart'].forEach(ev=>a.addEventListener(ev,e=>e.stopPropagation()));
    a.addEventListener('click',e=>{ e.stopPropagation(); });
    return a;
  }
  function renderLinkOverlay(index){
    const ov=document.getElementById('linkOverlay');ov.innerHTML='';
    for(const l of (pageLinks[index]||[])) ov.appendChild(makeLink(l));
  }

  function annotationUrl(a){
    const raw=a.url || a.unsafeUrl || (typeof a.contents==='string' ? a.contents : '');
    return /^https?:\/\//i.test(raw) ? raw : null;
  }
  async function addPdfLinks(page, viewport, host){
    const links=await collectPdfLinks(page,viewport);
    for(const l of links) host.appendChild(makeLink(l));
  }

  async function renderReader(){
    if(!currentPdf)return;
    readerPage=Math.max(1,Math.min(currentPdf.numPages,readerPage));
    const page=await currentPdf.getPage(readerPage);
    const viewport=page.getViewport({scale:readerZoom*1.7});
    const canvas=document.getElementById('readerCanvas'),ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
    const cssW=viewport.width/1.7, cssH=viewport.height/1.7;
    canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';
    const readerPageEl=document.getElementById('readerPage'); readerPageEl.style.width=cssW+'px'; readerPageEl.style.height=cssH+'px';
    readerPageEl.querySelectorAll('.pdfLink').forEach(el=>el.remove());
    await page.render({canvasContext:ctx,viewport}).promise;
    await addPdfLinks(page,viewport,readerPageEl);
    document.getElementById('zoomLabel').textContent=Math.round(readerZoom*100)+'%';
    document.getElementById('readerViewport').scrollTo({top:0,left:0});
  }
  async function openReader(){readerPage=(flip?.getCurrentPageIndex()??0)+1;document.getElementById('reader').classList.remove('hidden');await renderReader()}
  document.getElementById('readCurrent').onclick=openReader;
  bookEl.addEventListener('dblclick',openReader);
  document.getElementById('closeReader').onclick=()=>document.getElementById('reader').classList.add('hidden');
  document.getElementById('zoomIn').onclick=async()=>{readerZoom=Math.min(3,readerZoom+.25);await renderReader()};
  document.getElementById('zoomOut').onclick=async()=>{readerZoom=Math.max(.75,readerZoom-.25);await renderReader()};
  document.getElementById('readerPrev').onclick=async()=>{readerPage--;await renderReader()};
  document.getElementById('readerNext').onclick=async()=>{readerPage++;await renderReader()};


  // Os links usam elementos <a> nativos sobre a página. Não interceptamos o clique globalmente,
  // pois isso impedia a navegação em alguns navegadores.

  document.getElementById('prev').onclick=()=>flip?.flipPrev();
  document.getElementById('next').onclick=()=>flip?.flipNext();
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip?.flipPrev(); if(e.key==='ArrowRight')flip?.flipNext();});
  document.getElementById('pdfInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);loadPdf(objectUrl)});
  document.getElementById('fullscreen').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()};
  loadPdf(DEFAULT_PDF);
</script>
</body>
</html>
